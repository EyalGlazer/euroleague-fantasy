<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>EuroLeague Fantasy Helper</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1420;--card:#171e2e;--line:#26304a;--txt:#e6ebf5;--mut:#8b97b3;--acc:#4f8cff}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.head{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:20px;margin:4px 0 22px}
.head img{height:46px;width:auto;background:#fff;border-radius:12px;padding:8px 16px}
h1{margin:0;font-size:30px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
select,input{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
input[type=number]{width:80px}select{min-width:130px}
button{background:none;color:var(--acc);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.rng{min-width:240px}.rng b{color:var(--txt);font-weight:600}
.slider{position:relative;height:26px;margin-top:2px}
.track,.fill{position:absolute;top:11px;height:4px;border-radius:2px}
.track{left:0;right:0;background:var(--line)}.fill{background:var(--acc)}
.slider input{position:absolute;left:0;top:0;width:100%;height:26px;margin:0;padding:0;background:none;border:0;
 -webkit-appearance:none;appearance:none;pointer-events:none}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;
 background:var(--acc);border:2px solid var(--bg);cursor:grab}
.slider input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);cursor:grab}
.slider input::-webkit-slider-runnable-track{background:none}.slider input::-moz-range-track{background:none}
.count{margin-left:auto;color:var(--mut);align-self:center}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th:nth-child(-n+5),td:nth-child(-n+5){text-align:left}
thead th{background:#1c2540;color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--txt)}th.on{color:var(--acc)}
tbody tr{border-top:1px solid var(--line)}tbody tr:hover{background:#1c2540}
.rank{color:var(--mut);width:40px}.pos{font-size:11px;padding:2px 8px;border-radius:99px;background:#243050}
.Guard{color:#7fd1ff}.Forward{color:#8be28b}.Center{color:#ffb86b}.HC{color:#d6a3ff}
.pos:is(.Guard,.Forward,.Center,.HC){background:#1f2a45}
.nm{cursor:default}
.ha{font-weight:700}.ha.H{color:#8be28b}.ha.A{color:#ffb86b}
.neg{color:#ff4d4d}.empty{padding:30px;text-align:center;color:var(--mut)}
.tip{position:fixed;z-index:10;pointer-events:none;background:#1c2540;border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px #0008;display:none}
.tip h4{margin:0 0 6px;font-size:13px}.tip .lg{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-bottom:4px}
.tip .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.charts{display:flex;gap:14px}.tip text{fill:var(--mut);font:10px sans-serif}
</style></head><body><div class="wrap">
<div class="head"><h1>EuroLeague Fantasy Helper</h1><img src="__LOGO__" alt="EuroLeague"></div>
<div class="filters">
 <label>Search<input id="q" placeholder="Name…"></label>
 <label>Team<select id="team"><option value="">All teams</option></select></label>
 <label>Position<select id="pos"><option value="">All positions</option></select></label>
 <label class="rng">Price: <b id="plabel"></b>
  <div class="slider"><div class="track"></div><div class="fill" id="pfill"></div>
   <input id="pmin" type="range"><input id="pmax" type="range"></div></label>
 <button id="reset">Reset</button><span class="count" id="count"></span>
</div>
<div class="tbl"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
</div>
<div class="tip" id="tip"></div>
<script>
const DATA=__DATA__;
const COLS=[["#",null],["Name",null],["Position",null],["Team",null],["Next Match",null],["FPT","fpt"],["Price","price"],["Plus","plus"],["FPT / 1M","fptpm"],["Plus / 1M","pluspm"]];
const NUM=new Set(["fpt","price","plus","fptpm","pluspm"]);
let sk="fpt",sd=-1;
const $=id=>document.getElementById(id);
const uniq=k=>[...new Set(DATA.map(p=>p[k]))].sort();
uniq("team").forEach(t=>$("team").add(new Option(t,t)));
uniq("pos").forEach(t=>$("pos").add(new Option(t,t)));
const prices=DATA.map(p=>p.price);
const PLO=Math.floor(Math.min(...prices)),PHI=Math.ceil(Math.max(...prices));
for(const id of ["pmin","pmax"]){const e=$(id);e.min=PLO;e.max=PHI;e.step=0.1}
function resetPrice(){$("pmin").value=PLO;$("pmax").value=PHI}
resetPrice();
function priceRange(src){
 let a=+$("pmin").value,b=+$("pmax").value;
 if(a>b){if(src==="pmin")a=b,$("pmin").value=a;else b=a,$("pmax").value=b}
 $("plabel").textContent=`${a.toFixed(1)} – ${b.toFixed(1)}`;
 $("pfill").style.left=(a-PLO)/(PHI-PLO)*100+"%";$("pfill").style.right=(PHI-b)/(PHI-PLO)*100+"%";
 return [a,b];
}
function head(){
 $("head").innerHTML=COLS.map(([l,k])=>k?`<th class="s ${k===sk?"on":""}" data-k="${k}">${l}${k===sk?(sd<0?" ▼":" ▲"):""}</th>`:`<th>${l==="#"?"":l}</th>`).join("");
 document.querySelectorAll("th.s").forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; if(k===sk) sd*=-1; else {sk=k; sd=NUM.has(k)?-1:1}
  render();});
}
const num=(v,d)=>{const t=v.toFixed(d);return `<td class="${t[0]==="-"?"neg":""}">${t}</td>`};
function render(src){
 const q=$("q").value.trim().toLowerCase(),t=$("team").value,po=$("pos").value;
 const [mn,mx]=priceRange(src);
 let r=DATA.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!t||p.team===t)&&(!po||p.pos===po)
  &&p.price>=mn-1e-9&&p.price<=mx+1e-9);
 r.sort((a,b)=>{const x=a[sk],y=b[sk];return (typeof x==="string"?x.localeCompare(y):x-y)*sd||b.fpt-a.fpt});
 head();
 $("count").textContent=`${r.length} / ${DATA.length} players`;
 $("body").innerHTML=r.length?r.map((p,i)=>`<tr><td class="rank">${i+1}</td><td class="nm" data-i="${DATA.indexOf(p)}">${p.name}</td>
 <td><span class="pos ${p.pos==="Head Coach"?"HC":p.pos}">${p.pos}</span></td><td>${p.team}</td><td>${p.nextopp} (${p.nextrank}) - <b class="ha ${p.nextha}">${p.nextha}</b></td>
 ${num(p.fpt,1)}${num(p.price,1)}${num(p.plus,1)}${num(p.fptpm,2)}${num(p.pluspm,2)}</tr>`).join("")
 :`<tr><td colspan="10" class="empty">No players match</td></tr>`;
}
["q","team","pos","pmin","pmax"].forEach(id=>$(id).addEventListener("input",()=>render(id)));
$("reset").onclick=()=>{["q","team","pos"].forEach(id=>$(id).value="");resetPrice();sk="fpt";sd=-1;render()};
render();
// hover chart: FPT bars + price line over the last rounds
function chart(p){
 const H=p.hist,n=H.length,W=210,Ht=150,L=30,R=10,T=14,B=22,pw=W-L-R,ph=Ht-T-B;
 const x=i=>L+pw*(i+.5)/n,base=T+ph;
 const axis=(top,bot)=>`<line x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" stroke="#26304a"/>
  <text x="${L-4}" y="${T+4}" text-anchor="end">${top}</text><text x="${L-4}" y="${base}" text-anchor="end">${bot}</text>`
  +H.map((_,i)=>`<text x="${x(i)}" y="${Ht-6}" text-anchor="middle">R${i+1}</text>`).join("");
 // FPT bars
 const fm=Math.max(10,...H.map(h=>h?h[0]:0)),yf=v=>base-v/fm*ph;
 let bars=axis(Math.round(fm),0);
 H.forEach((h,i)=>{if(!h)return;const bw=pw/n*.55,y=yf(h[0]);
  bars+=`<rect x="${x(i)-bw/2}" y="${y}" width="${bw}" height="${base-y}" rx="2" fill="#e8eefc"/>
  <text x="${x(i)}" y="${y-3}" text-anchor="middle" style="fill:#fff">${h[0]}</text>`});
 // Price line
 const ps=H.filter(Boolean).map(h=>h[1]);let lo=Math.min(...ps),hi=Math.max(...ps);if(hi-lo<0.5){lo-=0.5;hi+=0.5}
 const yp=v=>base-(v-lo)/(hi-lo)*ph;
 let line=axis(hi.toFixed(1),lo.toFixed(1));const pts=[];
 H.forEach((h,i)=>{if(h)pts.push([x(i),yp(h[1]),h[1]])});
 line+=`<polyline points="${pts.map(q=>q[0]+","+q[1]).join(" ")}" fill="none" stroke="#ff4d4d" stroke-width="2"/>`;
 pts.forEach(q=>line+=`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#ff4d4d"/><text x="${q[0]}" y="${q[1]-7}" text-anchor="middle" style="fill:#ffd0d0">${q[2]}</text>`);
 return `<h4>${p.name} <span style="color:var(--mut);font-weight:400">${p.team}</span></h4>
 <div class="charts"><div><div class="lg"><span><i style="background:#e8eefc"></i>FPT per round</span></div><svg width="${W}" height="${Ht}">${bars}</svg></div>
 <div><div class="lg"><span><i style="background:#ff4d4d"></i>Price</span></div><svg width="${W}" height="${Ht}">${line}</svg></div></div>`;
}
const tip=$("tip");
$("body").addEventListener("mousemove",e=>{
 const tr=e.target.closest("td[data-i]");
 if(!tr){tip.style.display="none";return}
 const p=DATA[+tr.dataset.i];
 if(tip.dataset.i!==tr.dataset.i){tip.innerHTML=chart(p);tip.dataset.i=tr.dataset.i}
 tip.style.display="block";
 const w=tip.offsetWidth,h=tip.offsetHeight;
 tip.style.left=Math.min(e.clientX+16,innerWidth-w-8)+"px";
 tip.style.top=Math.max(8,Math.min(e.clientY+12,innerHeight-h-8))+"px";
});
$("body").addEventListener("mouseleave",()=>tip.style.display="none");
</script></body></html>
